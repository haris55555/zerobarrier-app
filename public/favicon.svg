<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- Background -->
<rect width="512" height="512" rx="100" fill="#080612"/>

<!-- Outer glow ring -->
<circle cx="256" cy="256" r="220" fill="none" stroke="#00FFB2" stroke-width="3" opacity="0.3"/>
<circle cx="256" cy="256" r="200" fill="none" stroke="#00FFB2" stroke-width="1" opacity="0.15"/>

<!-- Gradient definition -->
<defs>
<linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#00FFB2;stop-opacity:1" />
<stop offset="100%" style="stop-color:#00B4D8;stop-opacity:1" />
</linearGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="8" result="coloredBlur"/>
<feMerge>
<feMergeNode in="coloredBlur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>

<!-- Lightning bolt -->
<polygon
points="290,80 180,280 250,280 220,430 340,220 265,220 310,80"
fill="url(#boltGrad)"
filter="url(#glow)"
/>

<!-- ZB text subtle -->
<text x="256" y="490"
font-family="Arial, sans-serif"
font-size="36"
font-weight="800"
fill="#00FFB2"
text-anchor="middle"
opacity="0.6"
letter-spacing="4">ZB</text>
</svg>
